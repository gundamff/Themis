# Hermes Ops Agent — 配置示例（Themis 安全硬化默认）
# 复制为本机/profile 的 config.yaml 后按环境填写。
# 敏感值写入 .env / secrets.env / Bitwarden / 1Password，禁止明文入库。

# ── 核心法则 ───────────────────────────────────────────────────────
soul: SOUL.md
# 权威安全全文：SECURITY.md（须与 SOUL 同目录；SOUL 内已含运行时短铁律）

# ── 审批（生产禁止 off；禁止依赖 YOLO）────────────────────────────
approvals:
  mode: smart                 # smart | manual；禁止 off
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  # 硬否决：即使 YOLO / mode:off 也不可执行（Hermes 原生）
  deny:
    - "rm -rf *"
    - "mkfs*"
    - "dd if=*"
    - "> /dev/sd*"
    - "shutdown*"
    - "reboot*"
    - "poweroff*"
    - "kubectl delete *"
    - "helm uninstall *"

# ── 终端后端（生产默认容器隔离）──────────────────────────────────
# local 仅用于可信开发机。网关/生产请用 docker（或 modal/daytona/vercel_sandbox）。
# 注意：容器后端下 Hermes 可能跳过「危险命令审批」（容器即边界）；
# 业务变更仍须走 Themis preflight + 人工审批，不可把「在容器里」当成免审。
terminal:
  backend: docker
  docker_image: "nousresearch/hermes-sandbox:desktop"
  docker_forward_env: []      # 默认不向容器注入密钥；按需显式添加
  # env_passthrough: []

# ── Agent 工具策略 ────────────────────────────────────────────────
agent:
  # 名称以官方 Toolsets Reference 为准：
  # https://hermes-agent.nousresearch.com/docs/reference/toolsets-reference
  disabled_toolsets: []       # 全局禁用列表；observe profile 见 templates/profiles

# ── 运行时记忆（对齐 Hermes memories/ 时按安装文档映射）──────────
memory:
  - memory/index.md
  - memory/user-profile.md

# ── 清单与凭据 ────────────────────────────────────────────────────
inventory: inventory/hosts.yaml
secrets: config/secrets.env

# ── 平台 / 网关暴露面 ─────────────────────────────────────────────
platforms:
  api_server:
    enabled: true
    host: "127.0.0.1"         # 禁止默认 0.0.0.0
    port: 8642
    cors_origins:
      - "http://localhost:3000"
  webhook:
    enabled: false
    host: "127.0.0.1"
    port: 8644
    secret: "${WEBHOOK_SECRET}"

# 网关用户授权：生产必须配置 allowlist，禁止 GATEWAY_ALLOW_ALL_USERS=true
# 在 profile 的 .env 中设置（示例）：
#   GATEWAY_ALLOWED_USERS=your_id
#   TELEGRAM_ALLOWED_USERS=...
# 未配置 allowlist 且未 allow-all 时，Hermes 默认拒绝所有用户（fail-closed）。

# ── Egress（致命三角之一）─────────────────────────────────────────
# Agent 同时具备：私有数据 + 不可信内容 + 任意外联 = 高危。
# 生产要求：浏览器/web 工具按需禁用（见 observe profile）；
# 容器网络使用防火墙/egress allowlist；禁止生产 HERMES_YOLO_MODE=1。

# ── MCP（供应链）──────────────────────────────────────────────────
# 生产仅启用 security/mcp-allowlist.yaml 中的 server；禁止 @latest 与会话临时安装。
# 见 skills/security/mcp-supply-chain 与 attestations/mcp-allowlist.*.md。

# ── 审批票据（规程）────────────────────────────────────────────────
# 高危执行须 argv_digest 绑定的 Approval Ticket；见 security/schemas/approval-ticket.example.yaml。

# ── 审计 ──────────────────────────────────────────────────────────
audit:
  sink: "/var/log/hermes/audit.jsonl"
  rotate: daily
  retain_days: 90

# ── 逻辑角色 ──────────────────────────────────────────────────────
# 见 AGENTS.md；物理隔离用 templates/profiles/themis-{observe,execute,approve}/
