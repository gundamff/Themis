# Hermes Ops Agent — 配置示例
# 复制本文件为 config.yaml，按你的环境填写
# 敏感值（密码/密钥）一律写入 config/secrets.env，此处只引用变量名

# ── 核心法则（不可变，必须指向 SOUL.md）──────────────────────────────
soul: SOUL.md
# SECURITY.md 必须与 SOUL.md 一并存在于 HERMES_HOME / profile home

# ── 审批（生产环境禁止设为 off）────────────────────────────────────
approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  unattended_mode: deny

# ── 运行时加载的记忆文件 ────────────────────────────────────────────
memory:
  - memory/index.md          # skills 索引，触发词 → 路径
  - memory/user-profile.md   # 操作员偏好与授权范围

# ── 基础设施清单与凭据 ─────────────────────────────────────────────
inventory: inventory/hosts.yaml    # 主机/服务清单（不含密码）
secrets:   config/secrets.env      # 运行时凭据 provider；必须在 .gitignore 中
# 生产环境可改用 Hermes .env、Bitwarden 或 1Password provider，禁止明文入库。

# ── 平台适配器（保持与你的 Hermes 网关版本一致）─────────────────────
platforms:
  api_server:
    enabled: true
    host: "127.0.0.1"             # 禁止默认 0.0.0.0；公网暴露须例外流程
    port: 8642
    cors_origins:
      - "http://localhost:3000"   # Open WebUI 地址
  webhook:
    enabled: false                # 需要时改为 true，见 skills/integrate/webhook-subscriptions
    host: "127.0.0.1"             # 默认仅本机；对外监听须完成暴露面例外流程
    port: 8644
    secret: "${WEBHOOK_SECRET}"   # 从 secrets.env 注入

# ── 审计 ────────────────────────────────────────────────────────────
audit:
  sink: "/var/log/hermes/audit.jsonl"   # executor 的写操作强制落盘
  rotate: daily
  retain_days: 90

# ── 逻辑角色与物理隔离 ─────────────────────────────────────────────
# 逻辑角色及权限边界见 AGENTS.md；不要在本配置中声明伪 personas。
# 生产读写隔离使用 templates/profiles/ 下的独立 Hermes profiles。
